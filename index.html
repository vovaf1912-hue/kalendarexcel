function render(){let app=$('app');if(!configured&&!CONFIG.DEMO_MODE){app.innerHTML='<div class="login card"><h2>Настройте Supabase</h2><p>Укажите URL и publishable key в CONFIG внутри index.html.</p></div>';return}if(configured&&state.session&&state.role==='unassigned'){app.innerHTML='<div class="login card"><h2>Доступ не назначен</h2><p>Администратор должен назначить роль в таблице profiles.</p><button class="btn" onclick="logout()">Выйти</button></div>';return}if(configured&&!state.session){app.innerHTML=`<div class="login card"><button class="btn theme-toggle" type="button" onclick="toggleTheme()" style="float:right" aria-label="Переключить тему">◐ Тема</button><div class="brand"><div class="logo">GP</div><div><h1>Garage Planner</h1><div class="muted">Вход сотрудника</div></div></div><form id="loginForm" style="display:grid;gap:12px;margin-top:22px"><label>Email<input type="email" name="email" required autocomplete="username"></label><label>Пароль<input type="password" name="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">Войти</button><div id="loginError" class="alert"></div></form></div>`;$('loginForm').onsubmit=login;return}
let events=visibleEvents(),day=state.date;let viewTitle=state.view==='month'?dateFrom(day).toLocaleDateString('ru-RU',{month:'long',year:'numeric'}):state.view==='week'?`${fmtDate(startWeek(day))} — ${fmtDate(plusDays(startWeek(day),6))}`:fmtDate(day);
app.innerHTML=`<div class="shell"><header class="top"><div class="brand"><div class="logo">GP</div><div><h1>Garage Planner <span class="pill">Демо</span></h1><div class="small">Планирование загрузки автосервиса</div></div></div><div class="actions"><button class="btn" type="button" onclick="enablePush()" title="Разрешить системные уведомления">🔔 Уведомления</button><button class="btn theme-toggle" type="button" onclick="toggleTheme()" aria-label="Переключить тему" title="Светлая / тёмная тема">◐ <span class="theme-label">Тема</span></button><span class="small">${configured?esc(state.session?.user?.email):'Локальная демонстрация'} · ${esc(state.role==='owner'?'Владелец':getMaster(state.role))}</span>${configured?'<button class="btn" onclick="logout()">Выйти</button>':''}<button class="btn" onclick="toggleBoxes()">▦ История боксов</button><button class="btn primary" onclick="openEditor()">+ Автомобиль</button></div></header>${!configured?'<div class="notice">Демонстрационный режим: данные только в этом браузере. Для онлайн-работы настройте Supabase. <label style="display:inline-flex;align-items:center;gap:8px;margin-left:10px">Проверка роли <select class="select" onchange="state.role=this.value;state.filter=&#39;all&#39;;render()"><option value="owner" '+(state.role==='owner'?'selected':'')+'>Владелец</option>'+MASTERS.map(m=>'<option value="'+m.id+'" '+(state.role===m.id?'selected':'')+'>'+m.name+'</option>').join('')+'</select></label></div>':''}<div class="stats"><div class="stat"><span class="small">Всего записей</span><strong>${events.length}</strong></div><div class="stat"><span class="small">В работе</span><strong>${events.filter(e=>e.status==='work').length}</strong></div><div class="stat"><span class="small">Боксов</span><strong>2</strong></div><div class="stat"><span class="small">На сегодня</span><strong>${eventsOnDay(today).length}</strong></div></div><section class="card"><div class="toolbar"><div class="controls"><button class="btn" onclick="shift(-1)">←</button><button class="btn" onclick="state.date='${today}';render()">Сегодня</button><button class="btn" onclick="shift(1)">→</button><h2>${esc(viewTitle)}</h2></div><div class="controls">${['day','week','month'].map(v=>`<button class="btn ${state.view===v?'active':''}" onclick="changeView('${v}')">${{day:'День',week:'Неделя',month:'Месяц'}[v]}</button>`).join('')}</div></div><div class="filters"><select class="select" onchange="state.filter=this.value;render()"><option value="all">Все мастера</option>${MASTERS.filter(m=>!ownMaster()||ownMaster()===m.id).map(m=>`<option value="${m.id}" ${state.filter===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><input id="search" placeholder="Поиск машины, клиента, работы" value="${esc(state.search)}"><button class="btn" onclick="showNotifications()">Изменения (${state.notifications.length})</button></div><div id="calendar"></div><div class="legend">${Object.entries(STATUSES).map(([k,v])=>`<span>${esc(v)}</span>`).join(' · ')}</div><div class="small">Автомобиль может находиться в сервисе несколько дней, но рабочий интервал мастера задаётся отдельно. Свободное время рассчитывается по рабочим интервалам.</div></section><section class="card" id="boxesRoot" hidden></section></div>`;
$('search').oninput=e=>{let start=e.target.selectionStart;state.search=e.target.value;render();$('search').focus();$('search').setSelectionRange(start,start)};renderCalendar();if(boxScreen){$("boxesRoot").hidden=false;renderBoxes()}}
function renderCalendar(){return renderBoxCalendar();}function oldRenderCalendar(){let root=$('calendar');if(state.view==='week'){let first=startWeek(state.date),days=Array.from({length:7},(_,i)=>plusDays(first,i));root.innerHTML=`<div class="calendar"><div class="grid-head"><div>Бокс</div>${days.map(d=>`<div>${esc(dateFrom(d).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'}))}</div>`).join('')}</div>${MASTERS.filter(m=>state.filter==='all'||state.filter===m.id).filter(m=>!ownMaster()||ownMaster()===m.id).map(m=>`<div class="master-row"><div class="master-title"><strong>${esc(m.name)}</strong><span class="small">${visibleEvents().filter(e=>e.master_id===m.id).length} записей</span></div>${days.map(d=>`<div class="day-cell ${d===today?'today':''}">${eventsOnDay(d,m.id).map(e=>jobHTML(e,d)).join('')||'<div class="empty">Свободно</div>'}<button class="btn" style="padding:4px 7px;font-size:11px" onclick="openEditor(null,'${d}','${m.id}')">+</button></div>`).join('')}</div>`).join('')}</div>`}else if(state.view==='month'){let d=dateFrom(state.date),first=new Date(d.getFullYear(),d.getMonth(),1),offset=(first.getDay()+6)%7;first.setDate(first.getDate()-offset);let days=Array.from({length:42},(_,i)=>{let x=new Date(first);x.setDate(first.getDate()+i);return localDate(x)});root.innerHTML=`<div class="month-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(n=>`<div class="small" style="text-align:center;padding:7px">${n}</div>`).join('')}${days.map(day=>`<div class="month-day ${day.slice(0,7)!==state.date.slice(0,7)?'other':''} ${day===today?'today':''}"><div class="num">${dateFrom(day).getDate()} <button class="btn" style="float:right;padding:1px 5px;font-size:11px" onclick="openEditor(null,'${day}')">+</button></div>${eventsOnDay(day).map(e=>jobHTML(e,day)).join('')}</div>`).join('')}</div>`}else{root.innerHTML=`<div class="daylist">${MASTERS.filter(m=>state.filter==='all'||state.filter===m.id).filter(m=>!ownMaster()||ownMaster()===m.id).map(m=>`<div class="card"><h3>${esc(m.name)}</h3>${eventsOnDay(state.date,m.id).map(e=>jobHTML(e,state.date)).join('')||'<div class="empty">Свободно</div>'}<button class="btn" onclick="openEditor(null,'${state.date}','${m.id}')">+ Добавить</button></div>`).join('')}</div>`}}
function openEditor(id=null,day=state.date,master='anna'){if(state.role!=='owner')return toast('Редактирование доступно владельцу');let e=id?state.events.find(x=>x.id===id):null;if(id&&!e)return;if(e&&ownMaster()&&e.master_id!==ownMaster())return toast('Нет доступа к этой записи');if(ownMaster())master=ownMaster();let start=e?.start_at?.slice(0,16)||day+'T10:00',end=e?.end_at?.slice(0,16)||day+'T12:00';state.selectedColor=e?.color||COLORS[0];$('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${e?'Редактировать запись':'Новая запись'}</h2><form id="eventForm"><div class="formgrid"><label>Автомобиль *<input name="car" required maxlength="120" value="${esc(e?.car||'')}" placeholder="Toyota Camry"></label><label>Бокс *<select name="box_no" onchange="filterBoxMasters(this.form)"><option value="1">Бокс 1</option><option value="2">Бокс 2</option></select></label><label>Мастер *<select name="master_id">${MASTERS.filter(m=>!ownMaster()||ownMaster()===m.id).map(m=>`<option value="${m.id}" ${((e?.master_id||master)===m.id)?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><label>Начало работы мастера *<input type="datetime-local" name="start_at" required value="${esc(start)}"></label><label>Конец работы мастера *<input type="datetime-local" name="end_at" required value="${esc(end)}"></label><label>Автомобиль в сервисе до *<input type="date" name="service_end" required value="${esc(e?.service_end||day)}"></label><label>Статус<select name="status">${Object.entries(STATUSES).map(([k,v])=>`<option value="${k}" ${e?.status===k?'selected':''}>${esc(v)}</option>`).join('')}</select></label><label>Клиент<input name="client" value="${esc(e?.client||'')}"></label><label>Телефон<input name="phone" type="tel" value="${esc(e?.phone||'')}" placeholder="+7..."></label><div class="span2"><div style="font-weight:700;margin-bottom:7px">Виды работ</div><div id="workRows"></div><button class="btn" type="button" onclick="addWorkRow()">+ Добавить работу</button><div style="margin-top:8px">Общая стоимость: <strong id="workTotal">0 ₽</strong></div><div class="small">Для старых записей сохранено прежнее описание работ.</div></div><label class="span2">Комментарий<textarea name="note" rows="3">${esc(e?.note||'')}</textarea></label><div class="span2"><div class="small" style="margin-bottom:12px">Цвет записи</div><div class="dots">${COLORS.map(c=>`<button type="button" aria-label="Цвет ${c}" class="color-choice ${c===state.selectedColor?'chosen':''}" style="background:${c}" onclick="chooseColor('${c}')"></button>`).join('')}</div></div></div><div id="formError" class="alert" style="margin-top:12px"></div><div class="footer-actions">${e?`<button type="button" class="btn danger" onclick="removeEvent('${esc(e.id)}')">Удалить</button>`:''}<button type="button" class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></form></div></div>`;const current=boxAllocations.find(a=>a.appointment_id===id&&a.start_date<=day&&a.end_date>=day)||boxAllocations.find(a=>a.appointment_id===id);const chosenBox=current?.box_no||(master==='danya'?2:1);$('eventForm').elements.box_no.value=String(chosenBox);filterBoxMasters($('eventForm'),e?.master_id);const existingWorks=parseWorks(e?.work);if(existingWorks){existingWorks.forEach(addWorkRow)}else if(e?.work){addWorkRow({part:'Другая услуга',method:'',price:''});const warn=document.createElement('div');warn.className='small';warn.textContent='Старое описание: '+e.work+' (перенесите данные в новые поля перед сохранением)';$('workRows').before(warn)}else addWorkRow();$('workRows').addEventListener('input',updateWorkTotal);$('eventForm').onsubmit=ev=>saveForm(ev,id)}

const WORK_PARTS=['Капот', 'Крыло переднее левое', 'Крыло переднее правое', 'Бампер передний', 'Бампер задний', 'Дверь водительская спереди', 'Дверь водительская', 'Дверь пассажирская спереди', 'Дверь задняя слева', 'Дверь задняя справа', 'Крыша', 'Передняя стойка левая', 'Передняя стойка правая', 'Задняя стойка левая', 'Задняя стойка правая', 'Задняя стойка', 'Багажник', 'Полировка легкая+керамика', 'Полировка абразивная+керамика', 'Оклейка капот', 'Оклейка фары', 'Оклейка передние крылья', 'Оклейка зона риска (капот, передние крылья, передние стойки, фары, полоса крыши)', 'Полная оклейка автомобиля', 'Полировка царапин', 'Химчистка', 'трехфазная мойка', 'Другая услуга'];
const WORK_METHODS=['Точечно','Распыление','Другое'];
const WORK_PREFIX='@@GARAGE_WORKS_V1@@';
function parseWorks(value){if(!String(value||'').startsWith(WORK_PREFIX))return null;try{const v=JSON.parse(String(value).slice(WORK_PREFIX.length));return Array.isArray(v)?v:null}catch{return null}}
function workLabel(value){const arr=parseWorks(value);return arr?arr.map(x=>`${x.part}${x.method?' — '+x.method:''}${x.price!==''?' — '+Number(x.price).toLocaleString('ru-RU')+' ₽':''}`).join('; '):String(value||'')}
function workRowHTML(x={part:'',method:'',price:''}){
 const opt=(arr,v)=>`<option value="">Выберите...</option>`+arr.map(t=>`<option value="${esc(t)}" ${t===v?'selected':''}>${esc(t)}</option>`).join('');
 return `<div class="work-entry" style="padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0"><div class="formgrid"><label>Элемент автомобиля / услуга *<select class="work-part" required>${opt(WORK_PARTS,x.part)}</select></label><label>Способ ремонта *<select class="work-method" required>${opt(WORK_METHODS,x.method)}</select></label><label>Стоимость, ₽ *<input class="work-price" type="number" min="0" max="999999999" step="0.01" required value="${esc(x.price??'')}"></label><div style="display:flex;align-items:end"><button type="button" class="btn danger" onclick="this.closest('.work-entry').remove();updateWorkTotal()">Удалить работу</button></div></div></div>`;
}
function addWorkRow(x){const root=$('workRows');if(root){root.insertAdjacentHTML('beforeend',workRowHTML(x));updateWorkTotal()}}
function updateWorkTotal(){const el=$('workTotal');if(el)el.textContent=Array.from(document.querySelectorAll('.work-price')).reduce((a,i)=>a+(Number(i.value)||0),0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽'}
function collectWorks(){return Array.from(document.querySelectorAll('.work-entry')).map(row=>({part:row.querySelector('.work-part').value,method:row.querySelector('.work-method').value,price:row.querySelector('.work-price').value}));}

function chooseColor(c){state.selectedColor=c;document.querySelectorAll('.color-choice').forEach(b=>b.classList.toggle('chosen',b.style.backgroundColor===hexRgb(c)))}function hexRgb(hex){let n=parseInt(hex.slice(1),16);return `rgb(${n>>16}, ${(n>>8)&255}, ${n&255})`}function closeModal(){$('modalRoot').innerHTML=''}
async function saveForm(ev,id){ev.preventDefault();let f=new FormData(ev.target);let p=Object.fromEntries(f.entries());const chosenBox=Number(p.box_no);delete p.box_no;const rows=collectWorks();if(rows.length){if(rows.some(x=>!x.part||!x.method||x.price===''||!Number.isFinite(Number(x.price))||Number(x.price)<0)){ $('formError').textContent='Заполните элемент, способ и стоимость каждой работы';return}p.work=WORK_PREFIX+JSON.stringify(rows)}else p.work='';p.color=state.selectedColor;if(ownMaster())p.master_id=ownMaster();p.start_at=p.start_at+':00';p.end_at=p.end_at+':00';if(new Date(p.end_at)<=new Date(p.start_at)){ $('formError').textContent='Конец работы должен быть позже начала';return}if(p.service_end<p.start_at.slice(0,10)){$('formError').textContent='Дата окончания нахождения в сервисе не может быть раньше начала';return}if(!allowedInBox(chosenBox,p.master_id)){$('formError').textContent='Этот мастер не работает в выбранном боксе';return}let c=conflicts(p,id);if(c.length&&!confirm(`У мастера есть ${c.length} пересекающихся записей. Всё равно сохранить?`))return;let btn=ev.target.querySelector('[type=submit]');btn.disabled=true;try{if(configured){let result=id?await sb.from('appointments').update(p).eq('id',id).select().single():await sb.from('appointments').insert(p).select().single();if(result.error)throw result.error;if(id)state.events=state.events.map(x=>x.id===id?result.data:x);else state.events.push(result.data);try{await saveInitialBox(result.data,chosenBox,id)}catch(boxErr){toast('Запись сохранена, но размещение бокса не сохранено: '+boxErr.message)}void notifyJob(result.data.id,id?'updated':'created')}else{if(id)state.events=state.events.map(x=>x.id===id?{...x,...p}:x);else state.events.push({...p,id:uid()});localStorage.setItem('garage-demo-v1',JSON.stringify(state.events))}state.notifications.unshift(`${id?'Изменена':'Создана'} запись: ${p.car}`);closeModal();render();toast('Запись сохранена')}catch(e){$('formError').textContent=e.message||'Ошибка сохранения';btn.disabled=false}}
async function removeEvent(id){if(state.role!=='owner')return toast('Удаление доступно владельцу');let target=state.events.find(e=>e.id===id);if(ownMaster()&&target?.master_id!==ownMaster())return toast('Нет доступа');if(!confirm('Удалить запись?'))return;try{if(configured){let {error}=await sb.from('appointments').delete().eq('id',id);if(error)throw error}else{localStorage.setItem('garage-demo-v1',JSON.stringify(state.events.filter(e=>e.id!==id)))}state.events=state.events.filter(e=>e.id!==id);state.notifications.unshift('Запись удалена');closeModal();render();toast('Запись удалена')}catch(e){toast('Ошибка: '+e.message)}}
function showNotifications(){let arr=state.notifications.slice(0,20);$('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Последние изменения</h2>${arr.length?arr.map(x=>`<div class="job">${esc(x)}</div>`).join(''):'<p class="muted">Изменений пока нет</p>'}<button class="btn" onclick="closeModal()">Закрыть</button></div></div>`}
async function loadRole(){if(!configured||!state.session)return;const {data,error}=await sb.from('profiles').select('role').eq('id',state.session.user.id).single();if(error||!data){state.role='unassigned';toast('Для аккаунта не назначена роль в таблице profiles');return}state.role=data.role}
async function login(e){e.preventDefault();let f=new FormData(e.target);let {data,error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){$('loginError').textContent=error.message;return}state.session=data.session;await loadRole();await loadEvents();subscribe();render()}
async function logout(){if(channel){await sb.removeChannel(channel);channel=null}await sb.auth.signOut();state.session=null;state.events=[];boxAllocations=[];if(boxChannel){await sb.removeChannel(boxChannel);boxChannel=null}render()}
async function loadEvents(){if(!configured)return;let {data,error}=await sb.from('appointments').select('*').order('start_at',{ascending:true}).limit(2000);if(error){toast('Ошибка загрузки: '+error.message);return}state.events=data||[];await loadBoxes();render()}
function subscribe(){if(!configured||channel)return;channel=sb.channel('garage-planner-live').on('postgres_changes',{event:'*',schema:'public',table:'appointments'},()=>{state.notifications.unshift('Календарь обновлён другим сотрудником');loadEvents()}).subscribe()}
async function init(){if(configured){let {data}=await sb.auth.getSession();state.session=data.session;if(state.session){await loadRole();await loadEvents();subscribe()}sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){state.session=null;state.events=[];render()}})}else{try{state.events=JSON.parse(localStorage.getItem('garage-demo-v1'))||sampleEvents()}catch{state.events=sampleEvents()}}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}init();
</script></body></html>
