ass="controls">${['day','week','month'].map(v=>`<button class="btn ${state.view===v?'active':''}" onclick="changeView('${v}')">${{day:'День',week:'Неделя',month:'Месяц'}[v]}</button>`).join('')}</div></div><div class="filters"><select class="select" onchange="state.filter=this.value;render()"><option value="all">Все мастера</option>${MASTERS.filter(m=>!ownMaster()||ownMaster()===m.id).map(m=>`<option value="${m.id}" ${state.filter===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><input id="search" placeholder="Поиск машины, клиента, работы" value="${esc(state.search)}"><button class="btn" onclick="showNotifications()">Изменения (${state.notifications.length})</button></div><div id="calendar"></div><div class="legend">${Object.entries(STATUSES).map(([k,v])=>`<span>${esc(v)}</span>`).join(' · ')}</div><div class="small">Автомобиль может находиться в сервисе несколько дней, но рабочий интервал мастера задаётся отдельно. Свободное время рассчитывается по рабочим интервалам.</div></section></div>`;
$('search').oninput=e=>{let start=e.target.selectionStart;state.search=e.target.value;render();$('search').focus();$('search').setSelectionRange(start,start)};renderCalendar()}
function renderCalendar(){let root=$('calendar');if(state.view==='week'){let first=startWeek(state.date),days=Array.from({length:7},(_,i)=>plusDays(first,i));root.innerHTML=`<div class="calendar"><div class="grid-head"><div>Мастер</div>${days.map(d=>`<div>${esc(dateFrom(d).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'}))}</div>`).join('')}</div>${MASTERS.filter(m=>state.filter==='all'||state.filter===m.id).filter(m=>!ownMaster()||ownMaster()===m.id).map(m=>`<div class="master-row"><div class="master-title"><strong>${esc(m.name)}</strong><span class="small">${visibleEvents().filter(e=>e.master_id===m.id).length} записей</span></div>${days.map(d=>`<div class="day-cell ${d===today?'today':''}">${eventsOnDay(d,m.id).map(e=>jobHTML(e,d)).join('')||'<div class="empty">Свободно</div>'}<button class="btn" style="padding:4px 7px;font-size:11px" onclick="openEditor(null,'${d}','${m.id}')">+</button></div>`).join('')}</div>`).join('')}</div>`}else if(state.view==='month'){let d=dateFrom(state.date),first=new Date(d.getFullYear(),d.getMonth(),1),offset=(first.getDay()+6)%7;first.setDate(first.getDate()-offset);let days=Array.from({length:42},(_,i)=>{let x=new Date(first);x.setDate(first.getDate()+i);return localDate(x)});root.innerHTML=`<div class="month-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(n=>`<div class="small" style="text-align:center;padding:7px">${n}</div>`).join('')}${days.map(day=>`<div class="month-day ${day.slice(0,7)!==state.date.slice(0,7)?'other':''} ${day===today?'today':''}"><div class="num">${dateFrom(day).getDate()} <button class="btn" style="float:right;padding:1px 5px;font-size:11px" onclick="openEditor(null,'${day}')">+</button></div>${eventsOnDay(day).map(e=>jobHTML(e,day)).join('')}</div>`).join('')}</div>`}else{root.innerHTML=`<div class="daylist">${MASTERS.filter(m=>state.filter==='all'||state.filter===m.id).filter(m=>!ownMaster()||ownMaster()===m.id).map(m=>`<div class="card"><h3>${esc(m.name)}</h3>${eventsOnDay(state.date,m.id).map(e=>jobHTML(e,state.date)).join('')||'<div class="empty">Свободно</div>'}<button class="btn" onclick="openEditor(null,'${state.date}','${m.id}')">+ Добавить</button></div>`).join('')}</div>`}}
function openEditor(id=null,day=state.date,master='alex'){let e=id?state.events.find(x=>x.id===id):null;if(id&&!e)return;if(e&&ownMaster()&&e.master_id!==ownMaster())return toast('Нет доступа к этой записи');if(ownMaster())master=ownMaster();let start=e?.start_at?.slice(0,16)||day+'T09:00',end=e?.end_at?.slice(0,16)||day+'T11:00';state.selectedColor=e?.color||COLORS[0];$('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${e?'Редактировать запись':'Новая запись'}</h2><form id="eventForm"><div class="formgrid"><label>Автомобиль *<input name="car" required maxlength="120" value="${esc(e?.car||'')}" placeholder="Toyota Camry"></label><label>Мастер *<select name="master_id">${MASTERS.filter(m=>!ownMaster()||ownMaster()===m.id).map(m=>`<option value="${m.id}" ${((e?.master_id||master)===m.id)?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><label>Начало работы мастера *<input type="datetime-local" name="start_at" required value="${esc(start)}"></label><label>Конец работы мастера *<input type="datetime-local" name="end_at" required value="${esc(end)}"></label><label>Автомобиль в сервисе до *<input type="date" name="service_end" required value="${esc(e?.service_end||day)}"></label><label>Статус<select name="status">${Object.entries(STATUSES).map(([k,v])=>`<option value="${k}" ${e?.status===k?'selected':''}>${esc(v)}</option>`).join('')}</select></label><label>Клиент<input name="client" value="${esc(e?.client||'')}"></label><label>Телефон<input name="phone" type="tel" value="${esc(e?.phone||'')}" placeholder="+7..."></label><label class="span2">Виды работ<input name="work" value="${esc(e?.work||'')}" placeholder="Диагностика, замена масла"></label><label class="span2">Комментарий<textarea name="note" rows="3">${esc(e?.note||'')}</textarea></label><div class="span2"><div class="small" style="margin-bottom:12px">Цвет записи</div><div class="dots">${COLORS.map(c=>`<button type="button" aria-label="Цвет ${c}" class="color-choice ${c===state.selectedColor?'chosen':''}" style="background:${c}" onclick="chooseColor('${c}')"></button>`).join('')}</div></div></div><div id="formError" class="alert" style="margin-top:12px"></div><div class="footer-actions">${e?`<button type="button" class="btn danger" onclick="removeEvent('${esc(e.id)}')">Удалить</button>`:''}<button type="button" class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></form></div></div>`;$('eventForm').onsubmit=ev=>saveForm(ev,id)}
function chooseColor(c){state.selectedColor=c;document.querySelectorAll('.color-choice').forEach(b=>b.classList.toggle('chosen',b.style.backgroundColor===hexRgb(c)))}function hexRgb(hex){let n=parseInt(hex.slice(1),16);return `rgb(${n>>16}, ${(n>>8)&255}, ${n&255})`}function closeModal(){$('modalRoot').innerHTML=''}
async function saveForm(ev,id){ev.preventDefault();let f=new FormData(ev.target);let p=Object.fromEntries(f.entries());p.color=state.selectedColor;if(ownMaster())p.master_id=ownMaster();p.start_at=p.start_at+':00';p.end_at=p.end_at+':00';if(new Date(p.end_at)<=new Date(p.start_at)){ $('formError').textContent='Конец работы должен быть позже начала';return}if(p.service_end<p.start_at.slice(0,10)){$('formError').textContent='Дата окончания нахождения в сервисе не может быть раньше начала';return}let c=conflicts(p,id);if(c.length&&!confirm(`У мастера есть ${c.length} пересекающихся записей. Всё равно сохранить?`))return;let btn=ev.target.querySelector('[type=submit]');btn.disabled=true;try{if(configured){let result=id?await sb.from('appointments').update(p).eq('id',id).select().single():await sb.from('appointments').insert(p).select().single();if(result.error)throw result.error;if(id)state.events=state.events.map(x=>x.id===id?result.data:x);else state.events.push(result.data)}else{if(id)state.events=state.events.map(x=>x.id===id?{...x,...p}:x);else state.events.push({...p,id:uid()});localStorage.setItem('garage-demo-v1',JSON.stringify(state.events))}state.notifications.unshift(`${id?'Изменена':'Создана'} запись: ${p.car}`);closeModal();render();toast('Запись сохранена')}catch(e){$('formError').textContent=e.message||'Ошибка сохранения';btn.disabled=false}}
async function removeEvent(id){let target=state.events.find(e=>e.id===id);if(ownMaster()&&target?.master_id!==ownMaster())return toast('Нет доступа');if(!confirm('Удалить запись?'))return;try{if(configured){let {error}=await sb.from('appointments').delete().eq('id',id);if(error)throw error}else{localStorage.setItem('garage-demo-v1',JSON.stringify(state.events.filter(e=>e.id!==id)))}state.events=state.events.filter(e=>e.id!==id);state.notifications.unshift('Запись удалена');closeModal();render();toast('Запись удалена')}catch(e){toast('Ошибка: '+e.message)}}
function showNotifications(){let arr=state.notifications.slice(0,20);$('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Последние изменения</h2>${arr.length?arr.map(x=>`<div class="job">${esc(x)}</div>`).join(''):'<p class="muted">Изменений пока нет</p>'}<button class="btn" onclick="closeModal()">Закрыть</button></div></div>`}
async function loadRole(){if(!configured||!state.session)return;const {data,error}=await sb.from('profiles').select('role').eq('id',state.session.user.id).single();if(error||!data){state.role='unassigned';toast('Для аккаунта не назначена роль в таблице profiles');return}state.role=data.role}
async function login(e){e.preventDefault();let f=new FormData(e.target);let {data,error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){$('loginError').textContent=error.message;return}state.session=data.session;await loadRole();await loadEvents();subscribe();render()}
async function logout(){if(channel){await sb.removeChannel(channel);channel=null}await sb.auth.signOut();state.session=null;state.events=[];render()}
async function loadEvents(){if(!configured)return;let {data,error}=await sb.from('appointments').select('*').order('start_at',{ascending:true}).limit(2000);if(error){toast('Ошибка загрузки: '+error.message);return}state.events=data||[];render()}
function subscribe(){if(!configured||channel)return;channel=sb.channel('garage-planner-live').on('postgres_changes',{event:'*',schema:'public',table:'appointments'},()=>{state.notifications.unshift('Календарь обновлён другим сотрудником');loadEvents()}).subscribe()}
async function init(){if(configured){let {data}=await sb.auth.getSession();state.session=data.session;if(state.session){await loadRole();await loadEvents();subscribe()}sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){state.session=null;state.events=[];render()}})}else{try{state.events=JSON.parse(localStorage.getItem('garage-demo-v1'))||sampleEvents()}catch{state.events=sampleEvents()}}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}init();
</script></body></html>
